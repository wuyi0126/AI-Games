name: Import complete game collection
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import public game resources
        shell: python
        run: |
          from pathlib import Path
          import zipfile,urllib.request,io,base64
          for archive in Path('.').glob('games-*.zip'):
              with zipfile.ZipFile(archive) as z: z.extractall('.')
          data=urllib.request.urlopen('https://codeload.github.com/op7418/guizang-game-skill/zip/21683d9e00bd3736efe52f78d8380debbd2af3d3',timeout=120).read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  p=name.split('/',1)[-1]
                  if not p or name.endswith('/') or p.startswith('article/'): continue
                  dest=Path('wusuo-shanmen')/p
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          p=Path('maad-maxxing/assets/index-BxE7969Q.js')
          p.write_text(p.read_text().replace('return`/`+e','return`/AI-Games/maad-maxxing/`+e'))
          Path('index.html').write_bytes(base64.b64decode(''))
          Path('README.md').write_bytes(base64.b64decode(''))
      - name: Save source files in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wusuo-shanmen turbo-tails maad-maxxing index.html README.md
          git commit -m "Import complete games and publish collection homepage"
          git push
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -R wusuo-shanmen turbo-tails maad-maxxing _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

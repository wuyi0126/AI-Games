name: Import six hosted games
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified public game resources
        shell: python
        run: |
          import base64,zlib,json,hashlib,urllib.request,time,concurrent.futures
          from pathlib import Path
          unpack=lambda s:zlib.decompress(base64.b64decode(s)).decode()
          manifest=json.loads(unpack(''))
          def download(item):
           path,url,digest=item
           for attempt in range(4):
            try:
             data=urllib.request.urlopen(url,timeout=90).read()
             if hashlib.sha256(data).hexdigest()!=digest:raise ValueError('Source changed: '+path)
             p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);return
            except Exception:
             if attempt==3:raise
             time.sleep(attempt+1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:list(ex.map(download,manifest))
          exec(unpack(''))
          Path('index.html').write_text(unpack(''))
          Path('SOURCES-SIX.md').write_text('Six games imported from original public hosting on 2026-11-13. Author credits remain in each game. Runtime paths adapted for GitHub Pages. Starry Nightrider and Cozy Bakery online services remain external; water-keeps uncommon scene assets have a cross-origin fallback. No new license is granted for third-party works.\n'+'\n'.join(sorted(set(u.split('/')[2] for _,u,_ in manifest))))
          print('Imported',len(manifest),'verified files')
      - name: Save game resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starry-nightrider water-keeps evensong cozy-lisbon cozy-bakery tennis index.html SOURCES-SIX.md
          git commit -m "Host six additional games and use local lobby links"
          git push

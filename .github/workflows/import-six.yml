o/say-monster.mp3', 'https://tennis.sixfingerpunch.com/media/audio/say-monster.mp3', 'aa0f8e51aa0c1d3b4eaa1a2d8838ef2bdda47e861eb58a22a9e420062dde7cda'], ['tennis/media/audio/say-ultra.mp3', 'https://tennis.sixfingerpunch.com/media/audio/say-ultra.mp3', '381adbb1691ad267a7610aad04e808a7e0d1c959bcca3f6c8520b275958bfcd8']]
          def get(item):
           path,url,sha=item
           data=urllib.request.urlopen(url,timeout=90).read()
           assert hashlib.sha256(data).hexdigest()==sha,path
           p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:list(ex.map(get,items))
      - name: Save game resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis
          git commit -m "Complete Tennis dynamic audio and image resources"
          git push

name: Import six hosted games
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete Tennis media resources
        shell: python
        run: |
          import urllib.request,hashlib,concurrent.futures
          from pathlib import Path
          items = [['tennis/media/img/fist.jpg', 'https://tennis.sixfingerpunch.com/media/img/fist.jpg', '34dff166297903fcc13aaa87866ef72e44936647ea6ff4980ae71e659963405b'], ['tennis/media/img/panels.jpg', 'https://tennis.sixfingerpunch.com/media/img/panels.jpg', '2a3ea4f28fe4f108144bf42bc9fbb9e6d8fb0666044d8455b723c6ea193628ab'], ['tennis/media/img/eyes.jpg', 'https://tennis.sixfingerpunch.com/media/img/eyes.jpg', '2715d9570837674b55dd64e7353db21e6c99d8c64cbc4e59268c9f7ada3a8e84'], ['tennis/media/audio/shing.mp3', 'https://tennis.sixfingerpunch.com/media/audio/shing.mp3', '920e61c29061b458f0f1540876f87790d37af2140e946bd9ccbb175ddaa2e206'], ['tennis/media/audio/music-midi.mp3', 'https://tennis.sixfingerpunch.com/media/audio/music-midi.mp3', 'a8793fb84f043536c812c732f5dd202140cf1274233110cf271e831bcfb1402d'], ['tennis/media/audio/say-surf.mp3', 'https://tennis.sixfingerpunch.com/media/audio/say-surf.mp3', '7d09e053a67bc21513264afb44edf323e8f9abe2a9d530672e1ab6e977a9bf3b'], ['tennis/media/audio/whoosh.mp3', 'https://tennis.sixfingerpunch.com/media/audio/whoosh.mp3', '2e176b575510c884292b56257a268f177251d245f417b36112dd7d0846be6928'], ['tennis/media/audio/say-finish.mp3', 'https://tennis.sixfingerpunch.com/media/audio/say-finish.mp3', '8db527fe30980057668c65a59cfbb5936d37e4d989b4f21292b2cf20e3395fa9'], ['tennis/media/audio/say-multiball.mp3', 'https://tennis.sixfingerpunch.com/media/audio/say-multiball.mp3', 'dab89fc2c7271ba398bc45cd7dede3205c7e639d995eb55a8cdd0383b7676ba2'], ['tennis/media/audio/explosion.mp3', 'https://tennis.sixfingerpunch.com/media/audio/explosion.mp3', '679f90c68c815a4b358229f7e8b63175401a7733cb35d194d488d9635c7dd0b9'], ['tennis/media/audio/error.mp3', 'https://tennis.sixfingerpunch.com/media/audio/error.mp3', '31031df8bbc730b2c6a6d9448dfca48380b86fad3926e1f4e9a161f975713717'], ['tennis/media/audio/smash.mp3', 'https://tennis.sixfingerpunch.com/media/audio/smash.mp3', 'e55f68695ed47ec4a4de880f96d7dbd8b99e84c3fa72e7830ee758cac7d0da7f'], ['tennis/me
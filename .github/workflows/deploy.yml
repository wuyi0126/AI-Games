name: Deploy games to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble games
        run: |
          mkdir -p _site
          cp ./*.html _site/
          for archive in games-*.zip; do unzip -q -o "$archive" -d _site; done
          sed -i 's@return`/`+e@return`/AI-Games/maad-maxxing/`+e@g' _site/maad-maxxing/assets/index-BxE7969Q.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
